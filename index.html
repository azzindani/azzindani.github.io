<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Data science and AI — Indonesian legal AI datasets and models, office automation, and computer vision projects.">
    <meta name="author" content="Azzindani">
    <!-- Icons. The SVG is the real one and follows the browser's colour scheme;
         the PNG is for Safari, which ignores SVG favicons. Paths are relative so
         they resolve the same on a project page as at the domain root, and the
         hash router never touches them. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Azzindani">
    <meta property="og:title" content="Azzindani">
    <meta property="og:description" content="Data science and AI — Indonesian legal AI datasets and models, office automation, and computer vision projects.">
    <!-- The card is declared summary_large_image, so it needs an image or it
         renders as a large EMPTY box — worse than no card at all. Only 10 of
         91 posts carry a cover, so this is the default for the other 81 and
         for the site root. Regenerate with tools/make-og-card.js if the brand
         mark or the hero line changes. Absolute URL: crawlers do not resolve
         relative og:image reliably. -->
    <meta property="og:image" content="https://azzindani.github.io/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Azzindani — Empowering Artificial Intelligence">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://azzindani.github.io/og-card.png">
    <meta name="twitter:title" content="Azzindani">
    <meta name="twitter:description" content="Data science and AI — Indonesian legal AI datasets and models, office automation, and computer vision projects.">
    <link rel="canonical" href="https://azzindani.github.io/">
    <link rel="alternate" type="application/rss+xml" title="Azzindani — RSS" href="/feed.xml">
    <title>Azzindani</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load WITHOUT blocking the first paint.
         As a plain stylesheet this was render-blocking: every visitor waited on
         a third-party round trip before a single pixel appeared, and if that
         host is slow or unreachable they waited for the timeout instead.
         Measured locally with the request blocked: first contentful paint
         12,524ms against 64ms with this link removed. That is the failure mode,
         not the typical case — but it is a white screen owned by someone else's
         server, on a site whose readers are largely in Indonesia, where this
         host is not always fast.
         preload + onload swap flips it to a stylesheet once it arrives; until
         then the body renders in the local stack --font-sans already falls back
         to, and display=swap hands over without a second reflow. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    </noscript>
    <link rel="stylesheet" href="css/style.css">
    <!-- Apply persisted theme before paint to avoid flash of incorrect theme -->
    <script>
        (function() {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* no-op */ }
        })();
    </script>
</head>
<body>
    <!-- Brand mark, defined once and referenced by the navbar and the footer.
         Same node-and-edge geometry as favicon.svg. -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <symbol id="brand-mark" viewBox="0 0 32 32">
            <g fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round">
                <path d="M12.4 19.4 L6.6 6.6"/>
                <path d="M12.4 19.4 L25.4 8"/>
                <path d="M12.4 19.4 L25.4 25.6"/>
                <path d="M25.4 8 L25.4 25.6"/>
            </g>
            <g fill="currentColor">
                <circle cx="6.6" cy="6.6" r="3.3"/>
                <circle cx="25.4" cy="8" r="3.3"/>
                <circle cx="25.4" cy="25.6" r="3.3"/>
                <circle cx="12.4" cy="19.4" r="5.2"/>
            </g>
        </symbol>
    </svg>
    <!-- Skip link for keyboard / screen-reader users -->
    <a href="#app" class="skip-link">Skip to content</a>

    <!-- Landing background wash. Sits behind the canvas; shown only while the
         landing route is mounted (body.on-landing). See css/style.css. -->
    <div id="bg-wash" aria-hidden="true"></div>

    <!-- Neural network background canvas -->
    <canvas id="neural-bg" aria-hidden="true"></canvas>

    <!-- Reading progress bar -->
    <div class="reading-progress" id="reading-progress"></div>

    <!-- Navigation — minimal top bar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#/" class="nav-logo" aria-label="Home">
                <svg class="logo-icon" aria-hidden="true" focusable="false"><use href="#brand-mark"/></svg>
                <span class="logo-text">Azzindani</span>
            </a>
            <div class="nav-tabs" id="nav-tabs">
                <a href="#/" class="nav-tab" data-tab="home">Home</a>
                <a href="#/projects" class="nav-tab" data-tab="projects">Projects</a>
                <a href="#/blog" class="nav-tab" data-tab="blog">Blog</a>
                <a href="#/docs" class="nav-tab" data-tab="docs">Docs</a>
            </div>
            <div class="nav-search" id="nav-search">
                <span class="nav-search-icon">&#128269;</span>
                <input type="text" id="global-search" placeholder="Search posts..." autocomplete="off">
                <button class="cmd-key-hint" id="cmd-palette-btn" aria-label="Open command palette (⌘K)" title="Jump to any page (⌘K / Ctrl+K)">
                    <span>⌘K</span>
                </button>
            </div>
            <div class="nav-actions">
                <button class="nav-action-btn nav-mobile-menu" id="nav-mobile-menu" aria-label="Menu" title="Menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <button class="nav-action-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <a href="#/admin" class="nav-action-btn" data-tab="admin" aria-label="Admin" title="Admin">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </a>
            </div>
        </div>
        <!-- Mobile drawer (toggled by .nav-mobile-menu) -->
        <div class="nav-mobile-drawer" id="nav-mobile-drawer" hidden>
            <a href="#/" class="nav-tab" data-tab="home">Home</a>
            <a href="#/projects" class="nav-tab" data-tab="projects">Projects</a>
            <a href="#/blog" class="nav-tab" data-tab="blog">Blog</a>
            <a href="#/docs" class="nav-tab" data-tab="docs">Docs</a>
            <a href="#/collections" class="nav-tab">Collections</a>
        </div>
    </nav>

    <!-- Main App Container -->
    <main id="app" class="app-container" tabindex="-1"></main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-left">
                    <a href="#/" class="footer-logo">
                        <svg class="logo-icon" aria-hidden="true" focusable="false"><use href="#brand-mark"/></svg> Azzindani
                    </a>
                    <!-- Not a description of the work: the four links beside it
                         and the sticky navbar both already do that, and the old
                         version named three domains, which stage 4 of the landing
                         page argues is the variable rather than the subject.
                         "Rare" rather than "the one thing" — knowledge is not the
                         only non-rival good (languages, standards and networks all
                         grow when shared), and a site whose subject is claims you
                         can check cannot open its footer with one you can't. -->
                    <p class="footer-text">Knowledge is the rare thing that grows when it is given away.</p>
                </div>
                <!-- The work first, contact after. These ran LinkedIn, Email,
                     Hugging Face, GitHub — which put the 54 public repositories
                     last, behind two ways to send a message about them. -->
                <div class="footer-links">
                    <a href="https://github.com/azzindani" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <a href="https://huggingface.co/Azzindani" target="_blank" rel="noopener noreferrer">Hugging Face</a>
                    <a href="https://www.linkedin.com/in/azzindan1" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                    <a href="mailto:afzaazzindani@gmail.com">Email</a>
                </div>
            </div>
            <!-- Stage 8 claims the work is public; this is the page proving it
                 about itself. The site's own repository is already one of the
                 published projects, so the link costs nothing and closes the
                 argument on the page the reader is standing on. -->
            <div class="footer-bottom">
                <p>&copy; <span id="footer-year">2026</span> Azzindani ·
                    <a href="https://github.com/azzindani/azzindani.github.io" target="_blank" rel="noopener noreferrer">Source</a>
                </p>
            </div>
        </div>
    </footer>

    <!-- Back to top -->
    <button class="back-to-top" id="back-to-top" aria-label="Back to top">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>

    <!-- Toast notification -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Every third-party library is loaded on demand through LibLoader —
         marked included. It used to sit here as an eager <script>, which meant
         the landing page fetched a markdown parser it never calls. -->
    <!-- The highlight.js theme is injected by LibLoader.loadHighlightCss when
         the library itself is fetched. Code blocks render on a dark terminal
         background (--color-code-bg) in BOTH themes, so github-dark is correct
         either way. -->

    <!-- App Scripts -->
    <script src="js/lib/pure.js"></script>
    <!-- js/neural-bg.js is NOT here on purpose. It is 137KB of decorative
         canvas and used to be fetched, parsed and initialised before
         DOMContentLoaded on every route. LibLoader.loadNeuralBG pulls it in
         immediately on the landing route and after the load event everywhere
         else — see the note there. -->
    <script src="js/app.js"></script>
</body>
</html>
